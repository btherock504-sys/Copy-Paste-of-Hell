<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COPY</title>
<style>
  html, body { height: 100%; margin: 0; background: #fff; }
  body { display: flex; flex-direction: column; gap: 24px; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #out { width: min(90vw, 700px); font: 16px/1.5 Consolas, monospace; color: #333; white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
  button {
    width: min(90vw, 420px);
    height: 120px;
    border: 0;
    background: #ffa8c5;
    color: #000;
    font: 64px Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
  }
  button:active { background: #ff8fb4; }
  button:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
</style>
</head>
<body>
<button id="b" type="button">COPY</button>
<div id="out">Press Ctrl+V to clean and copy.</div>

<script>
/*
 * Ctrl+C your text, click COPY: the clipboard is read, cleaned (PDF line
 * breaks become single spaces) and written back, ready to paste anywhere.
 * Reading the clipboard needs Chrome's permission. Chrome remembers
 * "Allow" only for http://localhost or https:// pages, not file:// pages,
 * so open this through start-copy-button.bat (localhost).
 * Ctrl+V on the page also works and never needs permission.
 */
(function () {
  var b = document.getElementById('b');
  var timer;
  var last = '';
  var out = document.getElementById('out');

  function clean(t) {
    return String(t || '')
      .replace(/[\u00AD\u200B-\u200D\uFEFF]/g, '')
      .replace(/[\u0000-\u001F\u007F-\u009F\u2028\u2029\s]+/g, ' ')
      .trim();
  }

  function say(msg) {
    b.textContent = msg;
    clearTimeout(timer);
    timer = setTimeout(function () { b.textContent = 'COPY'; }, 900);
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  async function write(text) {
    if (!text) { say('EMPTY'); return; }
    last = text;
    out.textContent = text;
    try {
      await navigator.clipboard.writeText(text);
      say('COPIED');
    } catch (e) {
      say(legacyCopy(text) ? 'COPIED' : 'FAILED');
    }
  }

  document.addEventListener('paste', function (e) {
    var data = e.clipboardData && e.clipboardData.getData('text');
    if (data == null) return;
    e.preventDefault();
    write(clean(data));
  });

  b.addEventListener('click', async function () {
    try {
      write(clean(await navigator.clipboard.readText()));
    } catch (e) {
      if (last) write(last); else say('PRESS CTRL+V');
    }
  });
})();
</script>
</body>
</html>
